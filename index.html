<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brilho Real — Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  /* ─── CONFIG ─────────────────────────────────────── */
  :root{
    --bg:#f4f4f0;--surface:#fff;--surface2:#f9f9f7;--border:#e5e5e0;
    --text:#1a1a1a;--text2:#666660;--text3:#999994;
    --accent:#1a1a2e;--green:#1d9e75;--green-l:#eaf3de;--green-t:#3b6d11;
    --red:#e24b4a;--red-l:#fcebeb;--red-t:#a32d2d;
    --blue:#378add;--blue-l:#e6f1fb;--blue-t:#185fa5;
    --amber:#ba7517;--amber-l:#faeeda;--amber-t:#854f0b;
    --purple:#534ab7;--purple-l:#eeedfe;--purple-t:#3c3489;
    --radius:12px;--radius-sm:8px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

  /* HEADER */
  .header{background:var(--accent);color:#fff;padding:1.25rem 2rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
  .header-brand{display:flex;align-items:center;gap:12px}
  .header-logo{width:36px;height:36px;background:rgba(255,255,255,.15);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px}
  .header-title{font-size:18px;font-weight:600;letter-spacing:-.3px}
  .header-sub{font-size:12px;color:rgba(255,255,255,.6);margin-top:1px}
  .header-right{display:flex;align-items:center;gap:10px}
  .header-badge{background:rgba(255,255,255,.12);border-radius:20px;padding:4px 12px;font-size:12px;color:rgba(255,255,255,.8)}
  .sync-btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:8px;padding:6px 14px;font-size:12px;color:#fff;cursor:pointer;transition:background .15s}
  .sync-btn:hover{background:rgba(255,255,255,.2)}
  .sync-status{font-size:11px;color:rgba(255,255,255,.5)}

  /* LAYOUT */
  .container{max-width:1200px;margin:0 auto;padding:2rem}
  .section-title{font-size:11px;font-weight:600;color:var(--text3);letter-spacing:.8px;text-transform:uppercase;margin:2rem 0 1rem}

  /* LOADING */
  .loading{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4rem 2rem;color:var(--text3);gap:16px}
  .spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .error-box{background:var(--red-l);border:1px solid #f9c0c0;border-radius:var(--radius-sm);padding:16px 20px;font-size:13px;color:var(--red-t);margin:1rem 0}
  .setup-box{background:var(--amber-l);border:1px solid #f0c060;border-radius:var(--radius);padding:1.5rem;margin-bottom:1.5rem}
  .setup-box h3{font-size:14px;color:var(--amber-t);margin-bottom:8px}
  .setup-box p{font-size:13px;color:var(--amber-t);line-height:1.6;margin-bottom:6px}
  .setup-box code{background:rgba(0,0,0,.08);padding:2px 6px;border-radius:4px;font-family:monospace;font-size:12px}

  /* KPI */
  .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
  .kpi-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.25rem}
  .kpi-icon{font-size:20px;margin-bottom:10px}
  .kpi-label{font-size:11px;color:var(--text2);font-weight:500;margin-bottom:4px}
  .kpi-value{font-size:24px;font-weight:700;color:var(--text);letter-spacing:-.5px}
  .kpi-sub{font-size:11px;color:var(--text3);margin-top:4px}
  .kpi-card.green{border-left:3px solid var(--green)}
  .kpi-card.blue{border-left:3px solid var(--blue)}
  .kpi-card.purple{border-left:3px solid var(--purple)}
  .kpi-card.amber{border-left:3px solid var(--amber)}
  .kpi-card.red{border-left:3px solid var(--red)}

  /* CHARTS */
  .charts-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
  .charts-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.25rem}
  .card-title{font-size:13px;font-weight:600;color:var(--text);margin-bottom:1rem}
  .card-sub{font-size:11px;color:var(--text3);font-weight:400;margin-left:6px}
  .chart-wrap{position:relative;width:100%}

  /* TABLES */
  table{width:100%;border-collapse:collapse;font-size:12px}
  thead th{text-align:left;font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;padding:6px 8px;border-bottom:1px solid var(--border)}
  tbody tr{border-bottom:1px solid var(--bg)}
  tbody tr:last-child{border-bottom:none}
  tbody td{padding:8px;color:var(--text);vertical-align:middle}
  tbody tr:hover{background:var(--surface2)}
  .sku-chip{font-family:'Courier New',monospace;font-size:10px;background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:2px 6px;color:var(--text2)}
  .badge{display:inline-block;font-size:10px;font-weight:600;border-radius:4px;padding:2px 7px}
  .badge-green{background:var(--green-l);color:var(--green-t)}
  .badge-red{background:var(--red-l);color:var(--red-t)}
  .badge-amber{background:var(--amber-l);color:var(--amber-t)}
  .badge-blue{background:var(--blue-l);color:var(--blue-t)}

  /* MARGIN BAR */
  .margin-bar-wrap{display:flex;align-items:center;gap:8px}
  .margin-bar{height:6px;border-radius:3px;background:var(--green-l);overflow:hidden;flex:1}
  .margin-bar-fill{height:100%;background:var(--green);border-radius:3px}
  .margin-pct{font-size:11px;font-weight:600;color:var(--green-t);min-width:38px;text-align:right}

  /* ALERT */
  .alert{background:var(--amber-l);border:1px solid #f0c060;border-radius:var(--radius-sm);padding:12px 16px;font-size:12px;color:var(--amber-t);display:flex;align-items:flex-start;gap:8px;margin-bottom:16px}
  .tag-grid{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .tag{font-size:11px;font-weight:500;border-radius:4px;padding:3px 9px;background:var(--red-l);color:var(--red-t)}

  /* EMPTY */
  .empty-state{text-align:center;padding:2.5rem;color:var(--text3)}
  .empty-state p{font-size:13px}
  .empty-state small{font-size:11px;display:block;margin-top:4px}

  /* TABS */
  .tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:1.5rem}
  .tab{padding:10px 18px;font-size:13px;font-weight:500;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;background:none;border-top:none;border-left:none;border-right:none;transition:color .15s}
  .tab:hover{color:var(--text)}
  .tab.active{color:var(--accent);border-bottom-color:var(--accent)}
  .tab-content{display:none}
  .tab-content.active{display:block}

  /* FOOTER */
  .footer{text-align:center;padding:2rem;font-size:11px;color:var(--text3);border-top:1px solid var(--border);margin-top:3rem}

  @media(max-width:768px){
    .charts-grid,.charts-grid-3{grid-template-columns:1fr}
    .container{padding:1rem}
    .kpi-grid{grid-template-columns:repeat(2,1fr)}
  }
</style>
</head>
<body>

<!-- ════════════════════════════════════════════════════
     ⚙️  CONFIGURAÇÃO — cole aqui a URL do Apps Script
     ════════════════════════════════════════════════════ -->
<script>
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbygdxM3XQU8dkBO_65XSi7J_31aLVnIY1oulDBKtheUWyl-iiytr6cb7UMOJ8mPpXea/exec';
  // Exemplo: 'https://script.google.com/macros/s/ABC123.../exec'
  // Após colar, salve o arquivo e faça o upload no GitHub Pages.
</script>
<!-- ════════════════════════════════════════════════════ -->

<div class="header">
  <div class="header-brand">
    <div class="header-logo">🥈</div>
    <div>
      <div class="header-title">Brilho Real</div>
      <div class="header-sub">Pratas 925 · Dashboard de Gestão</div>
    </div>
  </div>
  <div class="header-right">
    <span class="sync-status" id="syncStatus">Carregando...</span>
    <button class="sync-btn" onclick="loadData()">↻ Atualizar</button>
  </div>
</div>

<div class="container" id="mainContainer">
  <div class="loading" id="loadingState">
    <div class="spinner"></div>
    <p>Buscando dados da planilha...</p>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════
// UTILITÁRIOS
// ═══════════════════════════════════════════════════════
const fmt = v => 'R$ ' + Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtK = v => v >= 1000 ? 'R$ ' + (v/1000).toFixed(1) + 'k' : fmt(v);
const pctNum = (c,v) => v > 0 ? (v-c)/v*100 : 0;
const pctStr = (c,v) => v > 0 ? pctNum(c,v).toFixed(1)+'%' : '—';
const COLORS = ['#378ADD','#1D9E75','#534AB7','#D85A30','#D4537E','#BA7517','#639922','#185FA5','#E24B4A','#8B0000','#0F6E56','#3C3489'];
let charts = {};

function destroyCharts() {
  Object.values(charts).forEach(c => { if(c) c.destroy(); });
  charts = {};
}

// ═══════════════════════════════════════════════════════
// BUSCAR DADOS
// ═══════════════════════════════════════════════════════
async function loadData() {
  document.getElementById('syncStatus').textContent = 'Atualizando...';

  // Verifica se a URL foi configurada
  if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL === 'COLE_AQUI_A_URL_DO_APPS_SCRIPT') {
    renderSetupMessage();
    return;
  }

  try {
    const res = await fetch(APPS_SCRIPT_URL);
    if (!res.ok) throw new Error('Erro HTTP ' + res.status);
    const data = await res.json();
    renderDashboard(data);
    const now = new Date();
    document.getElementById('syncStatus').textContent = 'Atualizado às ' + now.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  } catch(e) {
    renderError(e.message);
    document.getElementById('syncStatus').textContent = 'Erro ao sincronizar';
  }
}

// ═══════════════════════════════════════════════════════
// TELA DE CONFIGURAÇÃO (URL não preenchida)
// ═══════════════════════════════════════════════════════
function renderSetupMessage() {
  document.getElementById('mainContainer').innerHTML = `
    <div class="setup-box">
      <h3>⚙️ Configuração necessária</h3>
      <p>Para o dashboard buscar dados automaticamente da planilha, siga os passos abaixo:</p>
      <p><strong>Passo 1:</strong> Na planilha do Google Sheets, vá em <code>Extensões → Apps Script</code></p>
      <p><strong>Passo 2:</strong> Cole o código do arquivo <code>AppsScript_BrilhoReal.js</code> e salve</p>
      <p><strong>Passo 3:</strong> Clique em <code>Implantar → Nova implantação → App da Web → Qualquer pessoa → Implantar</code></p>
      <p><strong>Passo 4:</strong> Copie a URL gerada e cole no lugar de <code>COLE_AQUI_A_URL_DO_APPS_SCRIPT</code> neste arquivo HTML</p>
    </div>
  `;
  document.getElementById('syncStatus').textContent = 'Não configurado';
}

// ═══════════════════════════════════════════════════════
// TELA DE ERRO
// ═══════════════════════════════════════════════════════
function renderError(msg) {
  document.getElementById('mainContainer').innerHTML = `
    <div class="error-box">
      <strong>Não foi possível conectar à planilha.</strong><br>
      Verifique se a URL do Apps Script está correta e se o acesso está configurado como "Qualquer pessoa".<br>
      <small style="margin-top:6px;display:block;opacity:.7">Detalhes: ${msg}</small>
    </div>
    <button onclick="loadData()" style="padding:8px 16px;border-radius:8px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-size:13px">↻ Tentar novamente</button>
  `;
}

// ═══════════════════════════════════════════════════════
// RENDERIZAR DASHBOARD
// ═══════════════════════════════════════════════════════
function renderDashboard(data) {
  const produtos  = parseSheet(data.estoque,  ['sku','categoria','modelo','mm','cm','estoque','custo','venda','margemR','margemPct','situacao','obs']);
  const vendas    = parseSheet(data.vendas,    ['data','pedido','sku','produto','categoria','qtd','valorUnit','valorTotal','canal','obs']);
  const despesas  = parseSheet(data.despesas,  ['data','categoria','descricao','fornecedor','valor','pagamento','mes','obs']);

  destroyCharts();

  document.getElementById('mainContainer').innerHTML = buildHTML();

  buildTabEstoque(produtos);
  buildTabVendas(vendas, despesas);
  buildTabProdutos(produtos);

  // Tabs
  document.querySelectorAll('.tab').forEach(t => {
    t.addEventListener('click', e => {
      document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(x=>x.classList.remove('active'));
      t.classList.add('active');
      document.getElementById('tab-'+t.dataset.tab).classList.add('active');
    });
  });

  // Busca na tabela de produtos
  document.getElementById('searchInput')?.addEventListener('input', () => filterProdutos(produtos));
  document.getElementById('catFilter')?.addEventListener('change', () => filterProdutos(produtos));
}

// ═══════════════════════════════════════════════════════
// PARSE CSV/ARRAY
// ═══════════════════════════════════════════════════════
function parseSheet(rows, fields) {
  if (!rows || rows.length < 2) return [];
  return rows.slice(1).map(row => {
    const obj = {};
    fields.forEach((f,i) => { obj[f] = row[i] ?? ''; });
    obj.estoque  = parseFloat(obj.estoque)  || 0;
    obj.custo    = parseFloat(obj.custo)    || 0;
    obj.venda    = parseFloat(obj.venda)    || 0;
    obj.qtd      = parseFloat(obj.qtd)      || 0;
    obj.valorUnit= parseFloat(obj.valorUnit)|| 0;
    obj.valorTotal=parseFloat(obj.valorTotal)||0;
    obj.valor    = parseFloat(obj.valor)    || 0;
    return obj;
  }).filter(r => r.sku || r.data || r.categoria);
}

// ═══════════════════════════════════════════════════════
// HTML ESTRUTURA
// ═══════════════════════════════════════════════════════
function buildHTML() {
  return `
    <div class="tabs">
      <button class="tab active" data-tab="estoque">📦 Estoque</button>
      <button class="tab" data-tab="vendas">💰 Vendas</button>
      <button class="tab" data-tab="produtos">🏷️ Produtos</button>
    </div>
    <div class="tab-content active" id="tab-estoque"></div>
    <div class="tab-content" id="tab-vendas"></div>
    <div class="tab-content" id="tab-produtos"></div>
  `;
}

// ═══════════════════════════════════════════════════════
// ABA ESTOQUE
// ═══════════════════════════════════════════════════════
function buildTabEstoque(produtos) {
  const disp   = produtos.filter(p => p.estoque > 0);
  const semEst = [...new Set(produtos.filter(p=>p.estoque===0 && p.venda>0).map(p=>p.categoria))];
  const totalEstoque = disp.reduce((s,p) => s + p.estoque, 0);
  const totalCusto   = disp.reduce((s,p) => s + p.estoque*p.custo, 0);
  const totalVenda   = disp.reduce((s,p) => s + p.estoque*p.venda, 0);
  const margemMedia  = produtos.filter(p=>p.venda>0).reduce((s,p)=>s+pctNum(p.custo,p.venda),0) / produtos.filter(p=>p.venda>0).length;

  const aliancasSemPreco = produtos.filter(p=>p.categoria==='Alianças' && p.venda===0).length;

  const el = document.getElementById('tab-estoque');
  el.innerHTML = `
    ${aliancasSemPreco > 0 ? `<div class="alert">⚠️ <span><strong>${aliancasSemPreco} alianças</strong> sem preço de venda definido — defina na planilha para incluir nas métricas.</span></div>` : ''}
    <p class="section-title">Visão geral</p>
    <div class="kpi-grid">
      <div class="kpi-card green"><div class="kpi-icon">📦</div><div class="kpi-label">Itens disponíveis</div><div class="kpi-value">${totalEstoque}</div><div class="kpi-sub">de ${produtos.length} SKUs cadastrados</div></div>
      <div class="kpi-card blue"><div class="kpi-icon">💵</div><div class="kpi-label">Valor a custo</div><div class="kpi-value">${fmtK(totalCusto)}</div><div class="kpi-sub">capital parado em estoque</div></div>
      <div class="kpi-card purple"><div class="kpi-icon">🏷️</div><div class="kpi-label">Receita potencial</div><div class="kpi-value">${fmtK(totalVenda)}</div><div class="kpi-sub">se vender tudo</div></div>
      <div class="kpi-card green"><div class="kpi-icon">📈</div><div class="kpi-label">Lucro potencial</div><div class="kpi-value">${fmtK(totalVenda-totalCusto)}</div><div class="kpi-sub">receita − custo</div></div>
      <div class="kpi-card amber"><div class="kpi-icon">📊</div><div class="kpi-label">Margem média</div><div class="kpi-value">${margemMedia.toFixed(1)}%</div><div class="kpi-sub">sobre preço de venda</div></div>
    </div>
    <p class="section-title" style="margin-top:2rem">Estoque por categoria</p>
    <div class="charts-grid">
      <div class="card"><div class="card-title">Unidades em estoque</div><div class="chart-wrap" style="height:260px"><canvas id="catChart"></canvas></div></div>
      <div class="card"><div class="card-title">Valor a custo por categoria</div><div class="chart-wrap" style="height:260px"><canvas id="pieChart"></canvas></div></div>
    </div>
    ${semEst.length ? `<p class="section-title" style="margin-top:2rem">Categorias sem estoque — considere repor</p><div class="card"><div class="tag-grid">${semEst.map(c=>`<span class="tag">${c}</span>`).join('')}</div></div>` : ''}
  `;

  // Dados por categoria
  const catMap = {};
  produtos.filter(p=>p.estoque>0).forEach(p=>{
    if(!catMap[p.categoria]) catMap[p.categoria]={estoque:0,custo:0};
    catMap[p.categoria].estoque += p.estoque;
    catMap[p.categoria].custo   += p.estoque*p.custo;
  });
  const cats = Object.entries(catMap).sort((a,b)=>b[1].estoque-a[1].estoque);

  charts.cat = new Chart(document.getElementById('catChart'),{
    type:'bar',
    data:{labels:cats.map(([k])=>k),datasets:[{data:cats.map(([,v])=>v.estoque),backgroundColor:COLORS,borderRadius:5,borderSkipped:false}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>` ${c.parsed.y} unidades`}}},
      scales:{x:{ticks:{color:'#888',font:{size:11}},grid:{display:false},border:{display:false}},
              y:{ticks:{color:'#888',font:{size:11}},grid:{color:'rgba(0,0,0,.05)'},border:{display:false}}}}
  });

  const pieData = cats.filter(([,v])=>v.custo>0);
  charts.pie = new Chart(document.getElementById('pieChart'),{
    type:'doughnut',
    data:{labels:pieData.map(([k])=>k),datasets:[{data:pieData.map(([,v])=>Math.round(v.custo)),backgroundColor:COLORS,borderWidth:2,borderColor:'#fff'}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{font:{size:11},boxWidth:12,padding:10}},
      tooltip:{callbacks:{label:c=>` ${fmt(c.parsed)}`}}}}
  });
}

// ═══════════════════════════════════════════════════════
// ABA VENDAS
// ═══════════════════════════════════════════════════════
function buildTabVendas(vendas, despesas) {
  const totalV = vendas.reduce((s,v)=>s+v.valorTotal,0);
  const totalD = despesas.reduce((s,d)=>s+d.valor,0);
  const lucro  = totalV - totalD;

  // Vendas por mês
  const mesesMap = {};
  vendas.forEach(v=>{
    if(!v.data) return;
    const d = new Date(v.data);
    if(isNaN(d)) return;
    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    const label = d.toLocaleDateString('pt-BR',{month:'short',year:'2-digit'});
    if(!mesesMap[key]) mesesMap[key]={label,total:0};
    mesesMap[key].total += v.valorTotal;
  });
  const meses = Object.entries(mesesMap).sort(([a],[b])=>a.localeCompare(b)).slice(-12);

  // Canal de venda
  const canalMap = {};
  vendas.forEach(v=>{ if(v.canal){ canalMap[v.canal]=(canalMap[v.canal]||0)+v.valorTotal; }});

  const el = document.getElementById('tab-vendas');
  el.innerHTML = `
    <div class="kpi-grid">
      <div class="kpi-card green"><div class="kpi-icon">💰</div><div class="kpi-label">Receita realizada</div><div class="kpi-value">${fmtK(totalV)}</div><div class="kpi-sub">${vendas.length} pedidos</div></div>
      <div class="kpi-card red"><div class="kpi-icon">💸</div><div class="kpi-label">Total despesas</div><div class="kpi-value">${fmtK(totalD)}</div><div class="kpi-sub">${despesas.length} lançamentos</div></div>
      <div class="kpi-card ${lucro>=0?'green':'red'}"><div class="kpi-icon">📈</div><div class="kpi-label">Lucro líquido</div><div class="kpi-value">${fmtK(lucro)}</div><div class="kpi-sub">receita − despesas</div></div>
      <div class="kpi-card blue"><div class="kpi-icon">🛒</div><div class="kpi-label">Ticket médio</div><div class="kpi-value">${vendas.length?fmtK(totalV/vendas.length):'—'}</div><div class="kpi-sub">por pedido</div></div>
    </div>
    <p class="section-title" style="margin-top:2rem">Vendas por mês</p>
    <div class="card">
      <div class="card-title">Faturamento mensal <span class="card-sub">últimos 12 meses</span></div>
      <div class="chart-wrap" style="height:220px"><canvas id="vendasChart"></canvas></div>
    </div>
    <div class="charts-grid" style="margin-top:16px">
      <div class="card">
        <div class="card-title">Últimas vendas</div>
        ${vendas.length ? `<table><thead><tr><th>Data</th><th>Produto</th><th>Canal</th><th>Valor</th></tr></thead><tbody>
          ${vendas.slice().reverse().slice(0,10).map(v=>`<tr>
            <td>${v.data}</td>
            <td style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${v.produto||v.sku}</td>
            <td><span class="badge badge-blue">${v.canal||'—'}</span></td>
            <td style="font-weight:600">${fmt(v.valorTotal)}</td>
          </tr>`).join('')}
        </tbody></table>` : `<div class="empty-state"><p>Nenhuma venda registrada</p><small>Registre na aba 💰 Vendas da planilha</small></div>`}
      </div>
      <div class="card">
        <div class="card-title">Vendas por canal</div>
        ${Object.keys(canalMap).length ? `<div class="chart-wrap" style="height:200px"><canvas id="canalChart"></canvas></div>` : `<div class="empty-state"><p>Sem dados de canal ainda</p></div>`}
      </div>
    </div>
  `;

  charts.vendas = new Chart(document.getElementById('vendasChart'),{
    type:'bar',
    data:{labels:meses.length?meses.map(([,v])=>v.label):['Jan','Fev','Mar','Abr','Mai','Jun'],
          datasets:[{label:'Vendas',data:meses.length?meses.map(([,v])=>v.total):[0,0,0,0,0,0],backgroundColor:'#1D9E75',borderRadius:4}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>` ${fmt(c.parsed.y)}`}}},
      scales:{x:{ticks:{color:'#888',font:{size:11}},grid:{display:false},border:{display:false}},
              y:{ticks:{color:'#888',font:{size:11},callback:v=>'R$'+v.toLocaleString('pt-BR')},grid:{color:'rgba(0,0,0,.05)'},border:{display:false}}}}
  });

  if(Object.keys(canalMap).length) {
    charts.canal = new Chart(document.getElementById('canalChart'),{
      type:'doughnut',
      data:{labels:Object.keys(canalMap),datasets:[{data:Object.values(canalMap).map(v=>Math.round(v)),backgroundColor:COLORS,borderWidth:2,borderColor:'#fff'}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{font:{size:11},boxWidth:12}},tooltip:{callbacks:{label:c=>` ${fmt(c.parsed)}`}}}}
    });
  }
}

// ═══════════════════════════════════════════════════════
// ABA PRODUTOS
// ═══════════════════════════════════════════════════════
function buildTabProdutos(produtos) {
  const top10 = produtos.filter(p=>p.venda>0).sort((a,b)=>pctNum(b.custo,b.venda)-pctNum(a.custo,a.venda)).slice(0,10);
  const cats = [...new Set(produtos.map(p=>p.categoria))].sort();
  const precos = produtos.filter(p=>p.venda>0).map(p=>p.venda);
  const faixas = [0,0,0,0,0];
  precos.forEach(v=>{ if(v<60)faixas[0]++;else if(v<100)faixas[1]++;else if(v<150)faixas[2]++;else if(v<200)faixas[3]++;else faixas[4]++;});

  const el = document.getElementById('tab-produtos');
  el.innerHTML = `
    <p class="section-title">Top 10 por margem</p>
    <div class="card" style="margin-bottom:16px">
      <table><thead><tr><th>SKU</th><th>Produto</th><th>Custo</th><th>Venda</th><th>Margem</th><th>Estoque</th></tr></thead>
      <tbody>${top10.map(p=>{
        const m=pctNum(p.custo,p.venda);
        return `<tr>
          <td><span class="sku-chip">${p.sku}</span></td>
          <td>${p.categoria} — ${p.modelo}</td>
          <td style="color:var(--text2)">${fmt(p.custo)}</td>
          <td style="font-weight:600">${fmt(p.venda)}</td>
          <td><div class="margin-bar-wrap"><div class="margin-bar"><div class="margin-bar-fill" style="width:${m.toFixed(0)}%"></div></div><span class="margin-pct">${m.toFixed(1)}%</span></div></td>
          <td><span class="badge badge-${p.estoque>0?'green':'red'}">${p.estoque>0?p.estoque+' un':'Sem estoque'}</span></td>
        </tr>`;
      }).join('')}</tbody></table>
    </div>
    <p class="section-title">Distribuição de preços</p>
    <div class="charts-grid-3">
      <div class="card" style="grid-column:span 2">
        <div class="card-title">Faixas de preço — todos os produtos</div>
        <div class="chart-wrap" style="height:200px"><canvas id="priceChart"></canvas></div>
      </div>
      <div class="card">
        <div class="card-title">Resumo</div>
        <div style="display:flex;flex-direction:column;gap:10px;margin-top:6px">
          ${[['Menor preço',fmt(Math.min(...precos))],['Maior preço',fmt(Math.max(...precos))],['Preço médio',fmt(precos.reduce((s,v)=>s+v,0)/precos.length)],['Acima de R$200',precos.filter(v=>v>=200).length+' produtos']].map(([l,v])=>
            `<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)"><span style="font-size:12px;color:var(--text2)">${l}</span><span style="font-size:13px;font-weight:600">${v}</span></div>`
          ).join('')}
        </div>
      </div>
    </div>
    <p class="section-title">Catálogo completo</p>
    <div class="card">
      <div style="margin-bottom:12px;display:flex;gap:8px">
        <input type="text" id="searchInput" placeholder="Buscar produto, SKU..." style="flex:1;padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13px;background:var(--surface2);color:var(--text)">
        <select id="catFilter" style="padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:12px;background:var(--surface2);color:var(--text)">
          <option value="">Todas</option>
          ${cats.map(c=>`<option>${c}</option>`).join('')}
        </select>
      </div>
      <div style="overflow-x:auto">
        <table><thead><tr><th>SKU</th><th>Categoria</th><th>Modelo</th><th>Custo</th><th>Venda</th><th>Margem</th><th>Estoque</th><th>Situação</th></tr></thead>
        <tbody id="fullTable"></tbody></table>
        <p style="font-size:11px;color:var(--text3);margin-top:8px;text-align:right" id="tableCount"></p>
      </div>
    </div>
  `;

  charts.price = new Chart(document.getElementById('priceChart'),{
    type:'bar',
    data:{labels:['até R$60','R$60–100','R$100–150','R$150–200','R$200+'],datasets:[{data:faixas,backgroundColor:'#534AB7',borderRadius:5,borderSkipped:false}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>` ${c.parsed.y} produtos`}}},
      scales:{x:{ticks:{color:'#888',font:{size:11}},grid:{display:false},border:{display:false}},
              y:{ticks:{color:'#888',font:{size:11}},grid:{color:'rgba(0,0,0,.05)'},border:{display:false}}}}
  });

  filterProdutos(produtos);
}

function filterProdutos(produtos) {
  const q   = (document.getElementById('searchInput')?.value||'').toLowerCase();
  const cat = document.getElementById('catFilter')?.value||'';
  const rows = produtos.filter(p=>
    (!q||p.sku.toLowerCase().includes(q)||p.modelo.toLowerCase().includes(q)||p.categoria.toLowerCase().includes(q))&&
    (!cat||p.categoria===cat)
  );
  const tbody = document.getElementById('fullTable');
  if(!tbody) return;
  tbody.innerHTML = rows.map(p=>{
    const m=pctNum(p.custo,p.venda);
    return `<tr>
      <td><span class="sku-chip">${p.sku}</span></td>
      <td style="color:var(--text2)">${p.categoria}</td>
      <td>${p.modelo}</td>
      <td style="color:var(--text2)">${fmt(p.custo)}</td>
      <td style="font-weight:600">${p.venda>0?fmt(p.venda):'—'}</td>
      <td><span style="font-size:12px;font-weight:600;color:${m>=60?'#3b6d11':m>=45?'#185fa5':'#854f0b'}">${pctStr(p.custo,p.venda)}</span></td>
      <td style="text-align:center"><span class="badge badge-${p.estoque>0?'green':'amber'}">${p.estoque}</span></td>
      <td><span class="badge badge-${p.situacao==='DISPONÍVEL'?'green':'red'}">${p.situacao}</span></td>
    </tr>`;
  }).join('');
  const tc = document.getElementById('tableCount');
  if(tc) tc.textContent = rows.length + ' produto(s)';
}
